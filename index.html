<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأذكار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f1e7; --ink:#2a2118; --accent:#7a4b2a; --card:#fffdf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17130f; --ink:#efe6d6; --accent:#d9a46b; --card:#201a14; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Amiri Quran', 'Amiri', 'Traditional Arabic', serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 640px; background: var(--card);
    border-radius: 14px; padding: 24px;
    border-inline-start: 5px solid var(--accent);
  }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .bar .sp { flex:1; }
  button {
    font-family: inherit; font-size: 1.1rem; padding: 4px 14px;
    background: none; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; cursor: pointer;
  }
  button.on { background: var(--accent); color: var(--card); }
  #text { font-size: 1.5rem; line-height: 2.2; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="bar" id="tabs"></div>
  <p id="text">جاري التحميل...</p>
</main>
<script>
  // عدّل الأسماء وأسماء الملفات هنا
  const FILES = [
    { title: 'أذكار الصباح', file: 'morning.txt' },
    { title: 'أذكار المساء', file: 'evening.txt' }
  ];

  const tabs = document.getElementById('tabs');
  const box  = document.getElementById('text');
  let size = 1.5;

  FILES.forEach((f, i) => {
    const b = document.createElement('button');
    b.textContent = f.title;
    b.onclick = () => show(i);
    tabs.appendChild(b);
  });

  const sp = document.createElement('span'); sp.className = 'sp'; tabs.appendChild(sp);
  [['أ+', 1], ['أ−', -1]].forEach(([t, d]) => {
    const b = document.createElement('button');
    b.textContent = t;
    b.onclick = () => { size = Math.min(2.4, Math.max(1.1, size + d * 0.15)); box.style.fontSize = size + 'rem'; };
    tabs.appendChild(b);
  });

  function show(i) {
    [...tabs.querySelectorAll('button')].forEach((b, k) => b.classList.toggle('on', k === i));
    box.textContent = 'جاري التحميل...';
    fetch(FILES[i].file + '?v=' + Date.now())
      .then(r => { if (!r.ok) throw 0; return r.text(); })
      .then(t => box.textContent = t)
      .catch(() => box.textContent = 'تعذر تحميل ' + FILES[i].file);
    history.replaceState(null, '', '#' + (i + 1));
  }

  show((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
