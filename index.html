<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأذكار</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--ink:#2b2418;--mut:#8a7d68;--acc:#0f766e;--gold:#c0913f;--line:#e8dfcb;--on:#fff;--sh:0 6px 24px rgba(60,40,10,.08);--fs:1}
[data-theme=dark]{--bg:#0e1514;--card:#16201f;--ink:#ece4d2;--mut:#93a39d;--acc:#2dd4bf;--gold:#e0b25c;--line:#243230;--on:#06201d;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:0 14px 60px}
.hero{background:var(--hg,#0f766e);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 26px;border-radius:0 0 36px 36px;box-shadow:var(--sh);position:relative;overflow:hidden;max-width:720px;margin:auto}
.hero:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);left:-60px;bottom:-90px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative}
.g2{display:flex;gap:8px;justify-self:start}
#rf{justify-self:end}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.bsm{font-family:'Amiri Quran',serif;font-size:1.7rem}
.gr{text-align:center;margin-top:6px;font-weight:600;opacity:.9;position:relative}
.clock{font-size:3.2rem;font-weight:800;text-align:center;line-height:1.2;position:relative}
.clock small{font-size:1.2rem;font-weight:600;opacity:.85;margin-inline-start:4px}
.dates{text-align:center;position:relative;margin-top:6px}
.dates b{display:block;font-size:1.1rem}
.dates span{font-size:.9rem;opacity:.85}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:none}
.tab{flex:none;font:600 .95rem Cairo;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.meta{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 16px;font-size:.85rem;color:var(--mut)}
.tools button{font:600 .85rem Cairo;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:4px 10px;margin-inline-start:6px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px 12px;margin-bottom:14px;box-shadow:var(--sh);transition:opacity .3s}
.card.done{opacity:.5}
.t{font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*1.4rem);line-height:2.2;white-space:pre-wrap;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.cp{background:none;border:0;color:var(--mut);font:600 .85rem Cairo;cursor:pointer}
.lb{flex:1;text-align:center;color:var(--gold);font-weight:600;font-size:.9rem}
.ctr{min-width:70px;height:44px;border-radius:22px;border:0;background:linear-gradient(135deg,var(--acc),var(--gold));color:var(--on);font:800 1.15rem Cairo;cursor:pointer}
.card.done .ctr{background:var(--line);color:var(--mut)}
.fin{display:none;text-align:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--gold));color:var(--on);font-weight:700;margin-bottom:14px}
.fin.show{display:block}
.msg{text-align:center;color:var(--mut);padding:40px 10px}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:28px}
.dua{display:block;font-family:'Amiri Quran',serif;font-size:1.25rem;color:var(--ink);margin-top:12px}
.sig{display:block;direction:ltr;font-size:1.35rem;line-height:1.6;margin-top:10px;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.orn{color:var(--gold);letter-spacing:6px;margin-top:6px;display:block}
.mini{position:fixed;top:0;left:0;right:0;margin:auto;max-width:720px;height:calc(env(safe-area-inset-top,0px) + 52px);padding:env(safe-area-inset-top,0px) 16px 0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hg,#0f766e);color:#fff;border-radius:0 0 18px 18px;box-shadow:var(--sh);transform:translateY(-115%);transition:transform .3s}
body.sc .mini{transform:none}
.mini b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{flex:none;text-align:end;line-height:1.3;font-weight:800;font-size:1.05rem}
.mc small{font-weight:600;opacity:.85;font-size:.75rem}
.mc em{display:block;font-style:normal;font-weight:600;font-size:.72rem;opacity:.9}
.tabs{transition:top .3s}
body.sc .tabs{top:calc(env(safe-area-inset-top,0px) + 52px)}
.tools button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.up{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:1.3rem;box-shadow:var(--sh);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
body.sc .up{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.streak{text-align:center;margin-top:12px;position:relative;cursor:pointer}
.chip{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 16px;font-weight:800;font-size:.95rem}
.dots{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:9px}
.dots i{display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:800;color:#3a2a08;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28)}
.dots i.on{background:rgba(255,255,255,.8)}
.dots i.ok{width:16px;height:16px;background:#ffd479}
.dots i.td{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
.st2{font-size:.78rem;opacity:.92;margin-top:8px}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.sheet h3{margin:0 0 14px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:1.3rem;color:var(--mut);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--acc)}
.stat span{font-size:.72rem;color:var(--mut)}
.goal{margin-bottom:16px;font-size:.88rem;color:var(--mut)}
.goal .bar{margin-top:8px}
.bgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bd{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px}
.bd .em{font-size:1.8rem}
.bd b{font-size:.92rem}
.bd small{display:block;color:var(--mut);font-size:.72rem;line-height:1.5}
.bd.lock{opacity:.45;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--acc);color:var(--on);padding:12px 20px;border-radius:16px;font-weight:700;z-index:60;box-shadow:var(--sh);max-width:90%;text-align:center}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--gold));color:var(--on);font-weight:700}
.rem[hidden]{display:none}
.rem span{flex:1}
.rem button{background:rgba(255,255,255,.28);border:0;color:inherit;border-radius:10px;padding:6px 12px;font:700 .85rem Cairo;cursor:pointer}
.pbtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:0;background:var(--acc);color:var(--on);font:700 .95rem Cairo;cursor:pointer}
.rr{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600}
.rr label{display:flex;align-items:center;gap:10px}
.rr input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.rr input[type=time]{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<div class="mini"><b id="mt"></b><span class="mc" id="mc"></span></div>
<header class="hero">
  <div class="top">
    <span class="g2"><button class="ib" id="th" aria-label="الوضع">🌙</button><button class="ib" id="bl" aria-label="التنبيهات">🔔</button></span>
    <span class="bsm">﷽</span>
    <button class="ib" id="rf" aria-label="تحديث">↻</button>
  </div>
  <div class="gr" id="gr"></div>
  <div class="clock" id="clk"></div>
  <div class="dates"><b id="hj"></b><span id="gg"></span></div>
  <div class="streak" id="stk"></div>
</header>
<div class="wrap">
  <div class="rem" id="rem" hidden></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="pt"></span>
    <span class="tools"><button id="au" title="انتقال تلقائي للذكر التالي">⏭</button><button id="wk" title="إبقاء الشاشة مضيئة">🔆</button><button id="fp">أ+</button><button id="fm">أ−</button><button id="rs">↺ إعادة</button></span></div>
  <div class="fin" id="fin">تقبّل الله طاعتك 🤍</div>
  <main id="list"><p class="msg">جاري التحميل…</p></main>
  <footer><span class="orn">❖ ❖ ❖</span><span class="dua">لا تنسونا من صالح دعائكم</span><span class="sig">𝓓𝓻.𝓐𝓫𝓭𝓾𝓵𝔀𝓪𝓱𝓪𝓫 𝓜𝓸𝓱𝓪𝓶𝓶𝓮𝓭 𝓐𝓫𝓭𝓾𝓵𝓵𝓪𝓱 𝓐𝓵_𝓐𝓻𝓮𝓺𝓲</span></footer>
</div>
<div class="ov" id="ov"></div>
<button class="up" id="up" aria-label="للأعلى">↑</button>
<script>
addEventListener('error',function(e){var l=document.getElementById('list');if(l)l.innerHTML='<p class="msg">⚠️ خطأ: '+String(e.message||'').slice(0,140)+' ('+(e.lineno||0)+')</p>'});
</script>
<script>(function(){

// settings: set folder if the .txt files are inside a folder
const CFG={owner:'',repo:'',folder:'',fallback:['morning.txt','evening.txt']};
const $=s=>document.querySelector(s);
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const CNT=/([0-9])\uFE0F?\u20E3|🔟|💯/gu;
const base=CFG.folder?CFG.folder.replace(/\/$/,'')+'/':'';


let theme=S.get('adhkar:theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let fs=S.get('adhkar:fs',1);
function applyUI(){document.documentElement.dataset.theme=theme;$('#th').textContent=theme==='dark'?'☀️':'🌙';document.documentElement.style.setProperty('--fs',fs)}
$('#th').onclick=()=>{theme=theme==='dark'?'light':'dark';S.set('adhkar:theme',theme);applyUI()};
$('#fp').onclick=()=>{fs=Math.min(1.6,fs+.1);S.set('adhkar:fs',fs);applyUI()};
$('#fm').onclick=()=>{fs=Math.max(.8,fs-.1);S.set('adhkar:fs',fs);applyUI()};
applyUI();


const mk=(l,o)=>{try{return new Intl.DateTimeFormat(l,o)}catch{try{return new Intl.DateTimeFormat('ar-SA',o)}catch{return new Intl.DateTimeFormat(undefined,o)}}};
const F={t:mk('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}),
 h:mk('ar-SA-u-ca-islamic-umalqura-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
 g:mk('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}),
 hs:mk('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long'}),
 gs:mk('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'short'})};
const G=[[0,5,'#0b132b','#1c2d5a'],[5,7,'#2b3a67','#c86b85'],[7,11,'#0f766e','#3aa9a0'],[11,15,'#1d6fa5','#4fb3d9'],[15,18,'#b45f06','#d9954a'],[18,20,'#7b2d5b','#d4695a'],[20,24,'#0b132b','#1c2d5a']];
function tick(){try{
  const d=new Date(),h=d.getHours(),p={};
  F.t.formatToParts(d).forEach(x=>p[x.type]=x.value);
  $('#clk').innerHTML=`${p.hour}:${p.minute}<small>:${p.second}</small><small>${p.dayPeriod||''}</small>`;
  $('#mc').innerHTML=`${p.hour}:${p.minute}<small>:${p.second} ${p.dayPeriod||''}</small><em>${F.hs.format(d)} • ${F.gs.format(d)}</em>`;
  $('#hj').textContent='🌙 '+F.h.format(d);
  $('#gg').textContent='📅 '+F.g.format(d)+' م';
  const g=G.find(x=>h>=x[0]&&h<x[1]);
  document.documentElement.style.setProperty('--hg',`linear-gradient(160deg,${g[2]},${g[3]})`);
  $('#gr').textContent=h<5||h>=20?'ليلة طيبة':h<12?'صباح الخير':h<18?'طاب يومك':'مساء الخير';
}catch(e){}}
tick();setInterval(tick,1000);


function repoInfo(){if(CFG.owner&&CFG.repo)return{o:CFG.owner,r:CFG.repo};const h=location.hostname;if(!h.endsWith('.github.io'))return null;const o=h.split('.')[0];return{o,r:location.pathname.split('/')[1]||h}}
const dbg=[];
const sortL=l=>l.sort((a,b)=>a.name.localeCompare(b.name));
async function listFiles(){
  const ri=repoInfo();
  if(ri){
    try{
      const r=await fetch(`https://api.github.com/repos/${ri.o}/${ri.r}/git/trees/HEAD?recursive=1`);
      dbg.push('GitHub '+r.status);
      if(r.ok){
        const j=await r.json(),pre=CFG.folder?CFG.folder.replace(/\/$/,'')+'/':'';
        const l=(j.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith(pre)&&/\.txt$/i.test(x.path)&&!/(^|\/)(readme|license|robots|cname)[^\/]*$/i.test(x.path))
          .map(x=>{const rel=x.path.split('/').map(encodeURIComponent).join('/');return{name:x.path.split('/').pop(),rel,url:`https://raw.githubusercontent.com/${ri.o}/${ri.r}/HEAD/${rel}`}});
        if(l.length){S.set('adhkar:list',l);return sortL(l)}
        dbg.push('لا توجد ملفات txt في المستودع');
      }
    }catch(e){dbg.push('تعذر الاتصال بـ GitHub')}
  }else dbg.push('الرابط ليس github.io');
  try{const r=await fetch(base+'files.json');if(r.ok)return(await r.json()).map(n=>({name:n,url:base+n+'?v='+Date.now()}))}catch{}
  return S.get('adhkar:list',null)||CFG.fallback.map(n=>({name:n,url:base+n+'?v='+Date.now()}));
}


const nice=n=>n.replace(/\.txt$/i,'').replace(/^\d+[-_.\s]*/,'').replace(/[-_]+/g,' ');
function parse(f,txt){
  txt=txt.replace(/[\u200e\u200f\ufeff]/g,'').replace(/\r/g,'');
  const lines=txt.split('\n');const i=lines.findIndex(l=>l.trim());
  let title=nice(f.name);
  if(i>=0){const t=lines[i].replace(/ـ/g,'').trim(),nx=(lines[i+1]||'').trim();
    if(t.length<=40&&!/💯|\u20E3/.test(t)&&(!nx||nx[0]==='-')){title=t;lines.splice(i,1)}}
  const cards=lines.join('\n').split(/\n\s*\n/).map(b=>b.trim()).filter(b=>!/^[\s\-–—*_🌿💯]*$/u.test(b)).map(b=>{
    let n=1;
    if(/💯/u.test(b))n=100;
    else{const m=[...b.matchAll(CNT)];if(m.length){const l=m[m.length-1];n=l[0]==='🔟'?10:+l[1]}}
    const t=b.replace(CNT,'').replace(/^[\s\-–—]+/,'').replace(/[ \t]+\n/g,'\n').trim();
    return{t,n:n||1};
  }).filter(c=>c.t);
  return{title,slug:f.name.replace(/\.txt$/i,'').toLowerCase(),cards};
}
async function loadDoc(f){
  const ck='adhkar:txt:'+f.name;let t=null;
  for(const u of [f.url,f.rel].filter(Boolean)){
    try{const r=await fetch(u);if(r.ok){t=await r.text();S.set(ck,t);break}dbg.push(f.name+' '+r.status)}catch(e){dbg.push(f.name+' تعذر التحميل')}
  }
  if(t==null)t=S.get(ck,null);
  return t==null?null:parse(f,t);
}


let docs=[],cur=0,st=[],key='',els=[],autoNext=S.get('adhkar:au',true),wl=null;
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let day=dayKey();
function build(){const t=$('#tabs');t.textContent='';docs.forEach((d,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=d.title;b.onclick=()=>{show(i);const y=$('#list').offsetTop-70;if(scrollY>y)scrollTo({top:y})};t.append(b)})}
function prog(){
  const c=docs[cur].cards,done=c.filter((_,k)=>st[k]===0).length;
  $('#pb').style.width=(c.length?done/c.length*100:0)+'%';
  $('#pt').textContent=`${done} / ${c.length} أنجزت`;
  $('#fin').classList.toggle('show',c.length>0&&done===c.length);
  if(c.length>0&&done===c.length)markDone(docs[cur].slug);
}
function show(i){
  cur=i;const d=docs[i];history.replaceState(null,'','#'+d.slug);
  $('#mt').textContent=d.title;document.title=d.title+' | الأذكار';
  const tbs=document.querySelectorAll('.tab');tbs.forEach((b,k)=>b.classList.toggle('on',k===i));
  tbs[i]&&tbs[i].scrollIntoView({inline:'center',block:'nearest'});
  key=`adhkar:${dayKey()}:${d.slug}`;st=S.get(key,[]);
  d.cards.forEach((c,k)=>{if(typeof st[k]!=='number'||st[k]>c.n)st[k]=c.n});
  const box=$('#list');box.textContent='';els=[];
  d.cards.forEach((c,k)=>{
    const a=document.createElement('article'),p=document.createElement('p'),row=document.createElement('div'),
      cp=document.createElement('button'),lb=document.createElement('span'),b=document.createElement('button');
    a.className='card';p.className='t';p.textContent=c.t;row.className='row';
    cp.className='cp';cp.textContent='نسخ';
    cp.onclick=async()=>{try{await navigator.clipboard.writeText(c.t);cp.textContent='تم النسخ ✓';setTimeout(()=>cp.textContent='نسخ',1500)}catch{}};
    lb.className='lb';lb.textContent=c.n>1?`التكرار ×${c.n}`:'';
    b.className='ctr';
    const upd=()=>{a.classList.toggle('done',st[k]===0);b.textContent=st[k]===0?'✓':st[k]};
    b.onclick=()=>{st[k]=st[k]===0?c.n:st[k]-1;
      if(st[k]===0){navigator.vibrate&&navigator.vibrate(40);if(autoNext){const j=st.findIndex((v,x)=>x>k&&v!==0);if(j>0)setTimeout(()=>els[j].scrollIntoView({behavior:'smooth',block:'center'}),350)}}
      S.set(key,st);upd();prog()};
    upd();row.append(cp,lb,b);a.append(p,row);box.append(a);els.push(a);
  });
  prog();
}
$('#rs').onclick=()=>{if(!docs.length)return;st=docs[cur].cards.map(c=>c.n);S.set(key,st);show(cur)};
async function init(){
  $('#list').innerHTML='<p class="msg">جاري التحميل…</p>';
  docs=(await Promise.all((await listFiles()).map(loadDoc))).filter(Boolean);
  if(!docs.length){const m=document.createElement('p');m.className='msg';m.textContent='لم أجد أي نص. تأكد أن ملفات .txt مرفوعة في المستودع. ('+dbg.join(' · ')+')';$('#list').textContent='';$('#list').append(m);return}
  build();markTabs();setTimeout(check,400);
  const h=decodeURIComponent(location.hash.slice(1));
  let i=docs.findIndex(d=>d.slug===h);
  if(i<0){const re=new Date().getHours()<15?/صباح|morning/i:/مساء|evening/i;i=docs.findIndex(d=>re.test(d.title+d.slug));if(i<0)i=0}
  show(i);
}
$('#rf').onclick=init;
try{new IntersectionObserver(([e])=>document.body.classList.toggle('sc',!e.isIntersecting)).observe($('.hero'));}catch(e){}
try{$('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});}catch(e){}
try{$('#au').classList.toggle('on',autoNext);}catch(e){}
try{$('#au').onclick=()=>{autoNext=!autoNext;S.set('adhkar:au',autoNext);$('#au').classList.toggle('on',autoNext)};}catch(e){}
try{if(!('wakeLock' in navigator))$('#wk').hidden=true;}catch(e){}
try{$('#wk').onclick=async()=>{try{if(wl){await wl.release()}else{wl=await navigator.wakeLock.request('screen');$('#wk').classList.add('on');wl.addEventListener('release',()=>{wl=null;$('#wk').classList.remove('on')})}}catch{}};}catch(e){}
try{document.addEventListener('visibilitychange',()=>{if(!document.hidden&&docs.length&&dayKey()!==day){day=dayKey();visit();show(cur)}});}catch(e){}
const BG=[
{id:'s3',e:'🌱',t:'بداية الطريق',d:'3 أيام متتالية',k:'s',n:3},
{id:'s7',e:'🌿',t:'أسبوع كامل',d:'7 أيام متتالية',k:'s',n:7},
{id:'s14',e:'🌙',t:'أسبوعان',d:'14 يوماً متتالية',k:'s',n:14},
{id:'s30',e:'⭐',t:'شهر كامل',d:'30 يوماً متتالية',k:'s',n:30},
{id:'s60',e:'💎',t:'ثبات',d:'60 يوماً متتالية',k:'s',n:60},
{id:'s100',e:'👑',t:'مئة يوم',d:'100 يوم متتالية',k:'s',n:100},
{id:'c1',e:'🏅',t:'أول ختم',d:'إتمام مجموعة أذكار كاملة',k:'c',n:1},
{id:'c10',e:'🎖️',t:'عشر مجموعات',d:'إتمام 10 مجموعات',k:'c',n:10},
{id:'c50',e:'🏆',t:'خمسون مجموعة',d:'إتمام 50 مجموعة',k:'c',n:50},
{id:'f1',e:'☀️',t:'يوم كامل',d:'إتمام كل المجموعات في يوم واحد',k:'f',n:1}
];
function keyOf(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function loadV(){return Object.assign({last:'',streak:0,best:0,total:0,days:[],done:{},comp:0,full:0,badges:{}},S.get('adhkar:streak',null)||{})}
function valOf(v,b){return b.k==='s'?v.best:b.k==='c'?v.comp:v.full}
function csOf(v){let n=0;const d=new Date();if(!(v.done[keyOf(d)]||[]).length)d.setDate(d.getDate()-1);while((v.done[keyOf(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function toast(b,i){setTimeout(()=>{const t=document.createElement('div');t.className='toast';t.textContent='🏆 إنجاز جديد: '+b.e+' '+b.t;document.body.append(t);navigator.vibrate&&navigator.vibrate([40,40,40]);setTimeout(()=>t.remove(),4000)},i*4200)}
function award(v){
  const k=keyOf(new Date()),nw=[];
  BG.forEach(b=>{if(!v.badges[b.id]&&valOf(v,b)>=b.n){v.badges[b.id]=k;nw.push(b)}});
  if(nw.length){S.set('adhkar:streak',v);nw.forEach(toast)}
}
function renderStreak(v){
  try{
    const n=v.streak,op=new Set(v.days);let dots='';
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=keyOf(d);
      const c=(v.done[k]||[]).length?'ok':op.has(k)?'on':'';
      dots+='<i class="'+c+(i===0?' td':'')+'">'+(c==='ok'?'✓':'')+'</i>'}
    const w=n===1?'يوم واحد':n===2?'يومان':n<=10?n+' أيام':n+' يوماً';
    const em=BG.filter(b=>v.badges[b.id]).map(b=>b.e).join(' ');
    const nb=BG.find(b=>b.k==='s'&&!v.badges[b.id]);
    const goal=nb?'🎯 الهدف: '+nb.e+' '+nb.t+' ('+n+'/'+nb.n+')':'🎉 حققت كل أهداف السلسلة';
    $('#stk').innerHTML='<span class="chip">🔥 سلسلتك: '+w+'</span><div class="dots">'+dots+'</div><div class="st2">'+(em?em+' · ':'')+goal+'</div>';
  }catch(e){}
}
function visit(){
  try{
    const k=keyOf(new Date());const v=loadV();
    if(v.last!==k){
      const y=new Date();y.setDate(y.getDate()-1);
      v.streak=(v.last===keyOf(y))?v.streak+1:1;
      v.best=Math.max(v.best,v.streak);v.total++;v.last=k;
      v.days.push(k);v.days=v.days.slice(-60);
      S.set('adhkar:streak',v);
    }
    award(v);renderStreak(v);
  }catch(e){}
}
function markTabs(){
  try{const a=loadV().done[keyOf(new Date())]||[];
    document.querySelectorAll('.tab').forEach((b,i)=>{if(docs[i])b.textContent=docs[i].title+(a.indexOf(docs[i].slug)>=0?' ✓':'')})}catch(e){}
}
function markDone(slug){
  try{
    const v=loadV(),k=keyOf(new Date()),a=v.done[k]||(v.done[k]=[]);
    if(a.indexOf(slug)>=0){markTabs();return}
    a.push(slug);v.comp++;
    if(docs.length>1&&docs.every(d=>a.indexOf(d.slug)>=0))v.full++;
    const ks=Object.keys(v.done);if(ks.length>400)ks.slice(0,ks.length-400).forEach(x=>delete v.done[x]);
    S.set('adhkar:streak',v);award(v);renderStreak(v);markTabs();
  }catch(e){}
}
function openPanel(){
  const v=loadV(),ov=$('#ov');
  const nb=BG.find(b=>b.k==='s'&&!v.badges[b.id]);
  const pct=nb?Math.min(100,Math.round(v.streak/nb.n*100)):100;
  const st=[[v.streak,'السلسلة الحالية'],[v.best,'أفضل سلسلة'],[csOf(v),'سلسلة الإتمام'],[v.total,'أيام الفتح'],[v.comp,'مجموعات مكتملة'],[v.full,'أيام كاملة']];
  const fmt=k=>{const p=k.split('-');return F.gs.format(new Date(+p[0],+p[1]-1,+p[2]))};
  ov.innerHTML='<div class="sheet"><h3><span>🏆 إنجازاتك</span><button class="x">✕</button></h3>'
   +'<div class="stats">'+st.map(x=>'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'
   +(nb?'<div class="goal">الهدف التالي: '+nb.e+' '+nb.t+' — '+v.streak+' من '+nb.n+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>':'<div class="goal">🎉 حققت كل أهداف السلسلة</div>')
   +'<div class="bgs">'+BG.map(b=>{const g=v.badges[b.id];return '<div class="bd'+(g?'':' lock')+'"><span class="em">'+b.e+'</span><div><b>'+b.t+'</b><small>'+(g?'حصلت عليه '+fmt(g):b.d)+'</small></div></div>'}).join('')+'</div></div>';
  ov.classList.add('show');
}
$('#ov').onclick=e=>{if(e.target.id==='ov'||e.target.classList.contains('x'))$('#ov').classList.remove('show')};
$('#stk').onclick=openPanel;
const R=[
{id:'m',n:'أذكار الصباح',re:/صباح|morning/i},
{id:'e',n:'أذكار المساء',re:/مساء|evening/i},
{id:'s',n:'أذكار النوم',re:/نوم|sleep/i}
];
const RD={m:{on:true,t:'05:30'},e:{on:true,t:'17:00'},s:{on:true,t:'22:00'}};
function getRem(){const s=S.get('adhkar:rem',{})||{},o={};R.forEach(r=>{o[r.id]=Object.assign({},RD[r.id],s[r.id]||{})});return o}
function docIdx(r){return docs.findIndex(d=>r.re.test(d.title+' '+d.slug))}
function notify(r,i){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body:'حان وقت '+r.n+' — اضغط للفتح',icon:'icon-192.png',tag:'adhkar-'+r.id,lang:'ar',dir:'rtl',data:{url:'./'+(i>=0?'#'+docs[i].slug:'')}};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null))
      .then(reg=>{reg?reg.showNotification('الأذكار',o):new Notification('الأذكار',o)}).catch(()=>{});
  }catch(e){}
}
function fire(r,i){
  const el=$('#rem');el.textContent='';el.hidden=false;
  const sp=document.createElement('span');sp.textContent='🔔 حان وقت '+r.n;el.append(sp);
  if(i>=0){const b=document.createElement('button');b.textContent='فتح';
    b.onclick=()=>{show(i);el.hidden=true;scrollTo({top:Math.max(0,$('#list').offsetTop-70),behavior:'smooth'})};el.append(b)}
  const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{el.hidden=true};el.append(x);
  navigator.vibrate&&navigator.vibrate(60);
  notify(r,i);
}
function check(){
  try{
    if(!docs.length)return;
    const rm=getRem(),fired=S.get('adhkar:remfired',{})||{},now=new Date(),nm=now.getHours()*60+now.getMinutes();
    R.forEach(r=>{
      const c=rm[r.id];if(!c.on)return;
      const p=c.t.split(':'),tm=(+p[0])*60+(+p[1]);
      if((nm-tm+1440)%1440>=240)return;
      const b=new Date(now);if(nm<tm)b.setDate(b.getDate()-1);
      const k=keyOf(b);
      if(fired[r.id]===k)return;
      fired[r.id]=k;S.set('adhkar:remfired',fired);
      const i=docIdx(r);
      if(i>=0&&(loadV().done[keyOf(now)]||[]).indexOf(docs[i].slug)>=0)return;
      fire(r,i);
    });
  }catch(e){}
}
function buildIcs(){
  const rm=getRem(),now=new Date(),pad=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const base=location.origin+location.pathname;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Adhkar//AR//EN','CALSCALE:GREGORIAN'];
  R.forEach(r=>{
    const c=rm[r.id];if(!c.on)return;
    const p=c.t.split(':'),s=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+p[0],+p[1]),e=new Date(s.getTime()+600000),i=docIdx(r);
    L.push('BEGIN:VEVENT','UID:adhkar-'+r.id+'@'+location.hostname,'DTSTAMP:'+f(now),'DTSTART:'+f(s),'DTEND:'+f(e),'RRULE:FREQ=DAILY',
      'SUMMARY:🔔 '+r.n,'DESCRIPTION:حان وقت '+r.n+'\\n'+base+(i>=0?'#'+docs[i].slug:''),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.n,'TRIGGER:PT0M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function dlIcs(){
  const blob=new Blob([buildIcs()],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='adhkar-reminders.ics';document.body.append(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},15000);
}
function openRem(){
  const rm=getRem(),ov=$('#ov'),ns='Notification' in window?Notification.permission:'na';
  const tx=ns==='granted'?'✅ إشعارات الجهاز مفعّلة':ns==='denied'?'⛔ الإشعارات محجوبة من إعدادات الجهاز':ns==='na'?'ℹ️ إشعارات الجهاز تعمل بعد تثبيت التطبيق على الشاشة الرئيسية':'🔕 إشعارات الجهاز غير مفعّلة بعد';
  ov.innerHTML='<div class="sheet"><h3><span>🔔 تنبيهات الأذكار</span><button class="x">✕</button></h3>'
   +'<div class="goal">'+tx+'</div>'+(ns==='default'?'<button class="pbtn" id="rq">تفعيل إشعارات الجهاز</button>':'')
   +R.map(r=>'<div class="rr"><label><input type="checkbox" data-id="'+r.id+'"'+(rm[r.id].on?' checked':'')+'> '+r.n+'</label><input type="time" data-t="'+r.id+'" value="'+rm[r.id].t+'"></div>').join('')
   +'<button class="pbtn" id="rtest">🔔 تجربة تنبيه الآن</button><button class="pbtn" id="rics">📅 إضافة للتقويم (ينبّهك والتطبيق مغلق)</button>'
   +'<div class="goal" style="margin-top:14px">التنبيه داخل التطبيق يظهر عند فتحه أو وهو مفتوح في الوقت المحدد. أما التنبيه والتطبيق مغلق فيحتاج إضافة الأوقات إلى تقويم الجوال.</div></div>';
  ov.classList.add('show');
  const save=()=>{const o={};ov.querySelectorAll('[data-id]').forEach(c=>{const id=c.dataset.id,t=ov.querySelector('[data-t="'+id+'"]').value||RD[id].t;o[id]={on:c.checked,t}});S.set('adhkar:rem',o);S.set('adhkar:remfired',{})};
  ov.querySelectorAll('input').forEach(i=>i.onchange=()=>{save();check()});
  const rq=ov.querySelector('#rq');if(rq)rq.onclick=()=>{try{Notification.requestPermission().then(openRem)}catch(e){}};
  ov.querySelector('#rtest').onclick=()=>{ov.classList.remove('show');fire(R[0],docIdx(R[0]))};
  ov.querySelector('#rics').onclick=dlIcs;
}
$('#bl').onclick=openRem;
setInterval(check,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1)),i=docs.findIndex(d=>d.slug===h);if(i>=0&&i!==cur)show(i)});
visit();
init();
})();
</script>
