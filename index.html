<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأذكار</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffefb;--ink:#1f2926;--mut:#7d8580;--acc:#0f766e;--gold:#b8893a;--line:#e7e1d2;--on:#fff;--sh:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.07);--fs:1}
[data-theme=dark]{--bg:#0b1110;--card:#141d1c;--ink:#e9e4d6;--mut:#8b9a95;--acc:#2dd4bf;--gold:#e0b25c;--line:#223130;--on:#06201d;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:auto;padding:0 16px 70px}

/* hero */
.hero{background:var(--hg,#0f766e);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 22px;border-radius:0 0 clamp(26px,7vw,40px) clamp(26px,7vw,40px);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:min(60vw,300px);height:min(60vw,300px);border-radius:50%;background:rgba(255,255,255,.07);left:-12%;bottom:-25%;pointer-events:none}
.hero:after{content:"";position:absolute;width:min(38vw,190px);height:min(38vw,190px);border-radius:50%;background:rgba(255,255,255,.05);right:-6%;top:-8%;pointer-events:none}
.hin{position:relative;z-index:1;max-width:720px;margin:0 auto;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center}
.g2{display:flex;gap:8px}
.ib{flex:none;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:13px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bsm{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;font-family:'Amiri Quran',serif;font-size:clamp(1.15rem,5.2vw,1.55rem);line-height:2.1}
.bsm span{white-space:nowrap}
.bsm i{flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7))}
.bsm i:last-child{background:linear-gradient(270deg,transparent,rgba(255,255,255,.7))}
.gr{font-weight:600;opacity:.9;font-size:clamp(.9rem,3.6vw,1.05rem);margin-top:2px}
.clock{direction:ltr;display:flex;justify-content:center;font-size:clamp(3.2rem,16vw,4.8rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.hm{position:relative;display:inline-block}
.sx{position:absolute;left:100%;top:.42em;margin-left:8px;display:flex;flex-direction:column;align-items:flex-start;font-size:.3em;font-weight:700;line-height:1.3;opacity:.92}
.sx em{font-style:normal;font-weight:800;opacity:.85}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dates{margin:12px auto 0;padding:10px 16px;max-width:460px}
.hjr{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(1rem,4.3vw,1.18rem)}
.hjr .ic{width:18px;height:18px;opacity:.9}
.dates span{display:block;margin-top:2px;font-size:clamp(.82rem,3.4vw,.94rem);opacity:.85}
.streak{margin:10px auto 0;padding:14px 14px 12px;max-width:460px;cursor:pointer;text-align:start}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sl{display:flex;align-items:center;gap:10px}
.fl{width:38px;height:38px;border-radius:12px;background:rgba(255,215,120,.22);color:#ffd479;display:inline-flex;align-items:center;justify-content:center}
.sl small,.sg small{display:block;font-size:.7rem;opacity:.8}
.sl b{font-size:1.15rem;line-height:1.2}
.sg{text-align:end;font-size:.8rem;font-weight:600}
.wk{display:flex;justify-content:center;gap:clamp(6px,2.6vw,12px);margin-top:12px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;opacity:.95}
.wk i{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-style:normal;font-size:11px;font-weight:800}
.wk i:before{content:"";width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28)}
.wk .on i:before{background:rgba(255,255,255,.85)}
.wk .ok i{background:#ffd479;color:#3a2a08}
.wk .ok i:before{display:none}
.wk .td i{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.gb{height:5px;background:rgba(255,255,255,.22);border-radius:5px;overflow:hidden;margin-top:12px}
.gb i{display:block;height:100%;background:#ffd479;border-radius:5px;transition:width .5s}
.st2{font-size:.8rem;margin-top:8px;text-align:center;opacity:.95}

/* mini bar */
.mini{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 52px);padding:env(safe-area-inset-top,0px) max(16px,calc((100% - 720px)/2)) 0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hg,#0f766e);color:#fff;border-radius:0 0 18px 18px;box-shadow:var(--sh);transform:translateY(-115%);transition:transform .3s}
body.sc .mini{transform:none}
.mini b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{flex:none;text-align:end;line-height:1.3;font-weight:800;font-size:1.05rem}
.mc small{font-weight:600;opacity:.85;font-size:.75rem}
.mc em{display:block;font-style:normal;font-weight:600;font-size:.72rem;opacity:.9}

/* tabs & toolbar */
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--gold));color:var(--on);font-weight:700}
.rem[hidden]{display:none}
.rem span{flex:1}
.rem button{background:rgba(255,255,255,.28);border:0;color:inherit;border-radius:10px;padding:6px 12px;font:700 .85rem Cairo;cursor:pointer}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:none;transition:top .3s}
.tabs::-webkit-scrollbar{display:none}
body.sc .tabs{top:calc(env(safe-area-inset-top,0px) + 52px)}
.tab{flex:none;font:600 .95rem Cairo;padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s}
.tab.on{background:var(--acc);color:var(--on);border-color:var(--acc);box-shadow:0 4px 14px rgba(15,118,110,.25)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px;font-size:.85rem;color:var(--mut);font-weight:600}
.tb{display:flex;gap:6px}
.tb button{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 .8rem Cairo;cursor:pointer}
.tb button[hidden]{display:none}
.tb button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.tb .ic{width:17px;height:17px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 18px 18px;margin-bottom:14px;box-shadow:var(--sh);transition:opacity .3s}
.card.done{opacity:.55}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.no{min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--bg);color:var(--mut);font-size:.75rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tg{padding:3px 11px;border-radius:999px;background:rgba(184,137,58,.14);color:var(--gold);font-size:.78rem;font-weight:800}
.sp{flex:1}
.cpy{width:34px;height:34px;border:0;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer}
.cpy .ic{width:17px;height:17px}
.t{font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*1.4rem);line-height:2.2;white-space:pre-wrap;margin:0 0 16px}
.cf{display:flex;justify-content:center}
.ctr{position:relative;width:62px;height:62px;border-radius:50%;border:0;padding:0;cursor:pointer;background:conic-gradient(var(--acc) var(--p,0%),var(--line) 0)}
.ctr .in{position:absolute;top:5px;left:5px;right:5px;bottom:5px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font:800 1.3rem Cairo;color:var(--acc)}
.card.done .ctr{background:var(--gold)}
.card.done .ctr .in{color:var(--gold)}
.fin{display:none;text-align:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--gold));color:var(--on);font-weight:700;margin-bottom:14px}
.fin.show{display:block}
.msg{text-align:center;color:var(--mut);padding:40px 10px;line-height:2}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:28px}
.orn{color:var(--gold);letter-spacing:6px;margin-top:6px;display:block}
.dua{display:block;font-family:'Amiri Quran',serif;font-size:1.25rem;color:var(--ink);margin-top:12px}
.sig{display:block;direction:ltr;font-size:1.35rem;line-height:1.6;margin-top:10px;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.up{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
body.sc .up{opacity:1;pointer-events:auto}

/* sheet */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.sheet h3{margin:0 0 14px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--mut);cursor:pointer;display:inline-flex;padding:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--acc)}
.stat span{font-size:.72rem;color:var(--mut)}
.goal{margin-bottom:16px;font-size:.88rem;color:var(--mut)}
.goal .bar{margin-top:8px}
.bgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bd{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px}
.bd .em{font-size:1.8rem}
.bd b{font-size:.92rem}
.bd small{display:block;color:var(--mut);font-size:.72rem;line-height:1.5}
.bd.lock{opacity:.45;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--acc);color:var(--on);padding:12px 20px;border-radius:16px;font-weight:700;z-index:60;box-shadow:var(--sh);max-width:90%;text-align:center}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:0;background:var(--acc);color:var(--on);font:700 .95rem Cairo;cursor:pointer}
.rr{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600}
.rr label{display:flex;align-items:center;gap:10px}
.rr input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.rr input[type=time]{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hx{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;overflow:hidden;pointer-events:none}
.rr select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.rr input[type=range]{width:150px;accent-color:var(--acc)}
@media(min-width:900px){.wrap,.hin{max-width:780px}.t{font-size:calc(var(--fs)*1.6rem)}.clock{font-size:5rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="mini"><b id="mt"></b><span class="mc" id="mc"></span></div>
<header class="hero"><div class="hin">
  <div class="top">
    <span class="g2"><button class="ib" id="th" aria-label="الوضع"><svg class="ic"><use href="#i-moon"/></svg></button><button class="ib" id="bl" aria-label="التنبيهات"><svg class="ic"><use href="#i-bell"/></svg></button><button class="ib" id="bs" aria-label="الصوت والاهتزاز"><svg class="ic"><use href="#i-sliders"/></svg></button></span>
    <button class="ib" id="rf" aria-label="تحديث"><svg class="ic"><use href="#i-refresh"/></svg></button>
  </div>
  <div class="bsm"><i></i><span>بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span><i></i></div>
  <div class="gr" id="gr"></div>
  <div class="clock" id="clk"></div>
  <div class="glass dates"><div class="hjr"><svg class="ic"><use href="#i-moon"/></svg><b id="hj"></b></div><span id="gg"></span></div>
  <div class="glass streak" id="stk"></div>
</div></header>
<div class="wrap">
  <div class="rem" id="rem" hidden></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="pt"></span>
    <span class="tb">
      <button id="au" title="انتقال تلقائي للذكر التالي" aria-label="انتقال تلقائي"><svg class="ic"><use href="#i-next"/></svg></button>
      <button id="wk" title="إبقاء الشاشة مضيئة" aria-label="إبقاء الشاشة مضيئة"><svg class="ic"><use href="#i-eye"/></svg></button>
      <button id="fm" aria-label="تصغير الخط">أ−</button>
      <button id="fp" aria-label="تكبير الخط">أ+</button>
      <button id="rs" title="إعادة العدّ" aria-label="إعادة العدّ"><svg class="ic"><use href="#i-reset"/></svg></button>
    </span></div>

</div>

<div class="ov" id="ov"></div>

<script>
addEventListener('error',function(e){
  var l=document.getElementById('list'),m=String(e.message||'').slice(0,140);
  if(l&&!l.querySelector('.card')){l.innerHTML='<p class="msg">⚠️ خطأ: '+m+' ('+(e.lineno||0)+')</p>'}
  else{var t=document.createElement('div');t.className='toast';t.textContent='⚠️ '+m;document.body.appendChild(t);setTimeout(function(){t.remove()},5000)}
});
</script>
<script>(function(){

// settings: set folder if the .txt files are inside a folder
const CFG={owner:'ariki1982',repo:'',folder:'',fallback:['01-morning.txt','02-evening.txt','03-sleep.txt','morning.txt','evening.txt','sleep.txt']};
const $=s=>document.querySelector(s);
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const CNT=/([0-9])\uFE0F?\u20E3|🔟|💯/gu;
const base=CFG.folder?CFG.folder.replace(/\/$/,'')+'/':'';


let theme=S.get('adhkar:theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let fs=S.get('adhkar:fs',1);
function applyUI(){document.documentElement.dataset.theme=theme;$('#th').innerHTML=ic(theme==='dark'?'sun':'moon');document.documentElement.style.setProperty('--fs',fs)}
$('#th').onclick=()=>{theme=theme==='dark'?'light':'dark';S.set('adhkar:theme',theme);applyUI()};
$('#fp').onclick=()=>{fs=Math.min(1.6,fs+.1);S.set('adhkar:fs',fs);applyUI()};

const dbg=[];
const sortL=l=>l.sort((a,b)=>a.name.localeCompare(b.name));
function repoInfo(){
  if(CFG.owner&&CFG.repo)return{o:CFG.owner,r:CFG.repo};
  const h=location.hostname;
  if(h.endsWith('.github.io')){const o=h.split('.')[0];return{o,r:location.pathname.split('/')[1]||h}}
  return null;
}
async function treeFiles(o,r){
  const x=await fetch('https://api.github.com/repos/'+o+'/'+r+'/git/trees/HEAD?recursive=1');
  dbg.push(r+' '+x.status);
  if(!x.ok)return[];
  const j=await x.json(),pre=CFG.folder?CFG.folder.replace(/\/$/,'')+'/':'';
  return(j.tree||[]).filter(t=>t.type==='blob'&&t.path.startsWith(pre)&&/\.txt$/i.test(t.path)&&!/(^|\/)(readme|license|robots|cname)[^\/]*$/i.test(t.path))
    .map(t=>{const rel=t.path.split('/').map(encodeURIComponent).join('/');return{name:t.path.split('/').pop(),rel,url:'https://raw.githubusercontent.com/'+o+'/'+r+'/HEAD/'+rel}});
}
async function listFiles(){
  const ri=repoInfo(),seen={},cands=[];
  [ri,S.get('adhkar:repo',null),CFG.owner?{o:CFG.owner,r:CFG.owner+'.github.io'}:null].forEach(c=>{if(c&&!seen[c.o+'/'+c.r]){seen[c.o+'/'+c.r]=1;cands.push(c)}});
  const tryRepo=async c=>{try{const l=await treeFiles(c.o,c.r);if(l.length){S.set('adhkar:repo',c);S.set('adhkar:list',l);return sortL(l)}}catch(e){dbg.push('تعذر الاتصال بـ GitHub')}return null};
  for(const c of cands){const l=await tryRepo(c);if(l)return l}
  const own=(ri&&ri.o)||CFG.owner;
  if(own){
    try{
      const x=await fetch('https://api.github.com/users/'+own+'/repos?per_page=100');dbg.push('repos '+x.status);
      if(x.ok){const rs=(await x.json()).filter(r=>r.has_pages||/github\.io$/.test(r.name));
        for(const r of rs){const k=own+'/'+r.name;if(seen[k])continue;seen[k]=1;const l=await tryRepo({o:own,r:r.name});if(l)return l}}
    }catch(e){}
  }
  try{const r=await fetch(base+'files.json');if(r.ok)return(await r.json()).map(n=>({name:n,url:base+n+'?v='+Date.now()}))}catch(e){}
  return S.get('adhkar:list',null)||CFG.fallback.map(n=>({name:n,url:base+n+'?v='+Date.now()}));
}

const nice=n=>n.replace(/\.txt$/i,'').replace(/^\d+[-_.\s]*/,'').replace(/[-_]+/g,' ');
function parse(f,txt){
  txt=txt.replace(/[\u200e\u200f\ufeff]/g,'').replace(/\r/g,'');
  const lines=txt.split('\n');const i=lines.findIndex(l=>l.trim());
  let title=nice(f.name);
  if(i>=0){const t=lines[i].replace(/ـ/g,'').trim(),nx=(lines[i+1]||'').trim();
    if(t.length<=40&&!/💯|\u20E3/.test(t)&&(!nx||nx[0]==='-')){title=t;lines.splice(i,1)}}
  const cards=lines.join('\n').split(/\n\s*\n/).map(b=>b.trim()).filter(b=>!/^[\s\-–—*_🌿💯]*$/u.test(b)).map(b=>{
    let n=1;
    if(/💯/u.test(b))n=100;
    else{const m=[...b.matchAll(CNT)];if(m.length){const l=m[m.length-1];n=l[0]==='🔟'?10:+l[1]}}
    const t=b.replace(CNT,'').replace(/^[\s\-–—]+/,'').replace(/[ \t]+\n/g,'\n').trim();
    return{t,n:n||1};
  }).filter(c=>c.t);
  return{title,slug:f.name.replace(/\.txt$/i,'').toLowerCase(),cards};
}
async function loadDoc(f){
  const ck='adhkar:txt:'+f.name;let t=null;
  for(const u of [f.url,f.rel].filter(Boolean)){
    try{const r=await fetch(u);if(r.ok){t=await r.text();S.set(ck,t);break}dbg.push(f.name+' '+r.status)}catch(e){dbg.push(f.name+' تعذر التحميل')}
  }
  if(t==null)t=S.get(ck,null);
  return t==null?null:parse(f,t);
}

{id:'s7',e:'🌿',t:'أسبوع كامل',d:'7 أيام متتالية',k:'s',n:7},

];
function keyOf(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function loadV(){return Object.assign({last:'',streak:0,best:0,total:0,days:[],done:{},comp:0,full:0,badges:{}},S.get('adhkar:streak',null)||{})}
function valOf(v,b){return b.k==='s'?v.best:b.k==='c'?v.comp:v.full}
function csOf(v){let n=0;const d=new Date();if(!(v.done[keyOf(d)]||[]).length)d.setDate(d.getDate()-1);while((v.done[keyOf(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function toast(b,i){setTimeout(()=>{const t=document.createElement('div');t.className='toast';t.textContent='🏆 إنجاز جديد: '+b.e+' '+b.t;document.body.append(t);navigator.vibrate&&navigator.vibrate([40,40,40]);setTimeout(()=>t.remove(),4000)},i*4200)}
function award(v){
  const k=keyOf(new Date()),nw=[];
  BG.forEach(b=>{if(!v.badges[b.id]&&valOf(v,b)>=b.n){v.badges[b.id]=k;nw.push(b)}});
  if(nw.length){S.set('adhkar:streak',v);nw.forEach(toast)}
}
function renderStreak(v){
  try{
    const n=v.streak,op=new Set(v.days);let cols='';
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=keyOf(d);
      const ok=(v.done[k]||[]).length>0,c=(ok?'ok':op.has(k)?'on':'')+(i===0?' td':'');
      cols+='<div class="'+c+'"><i>'+(ok?ic('check').replace('class="ic"','class="ic" style="width:12px;height:12px;stroke-width:3"'):'')+'</i><span>'+F.wd.format(d)+'</span></div>'}
    const w=n===1?'يوم واحد':n===2?'يومان':n<=10?n+' أيام':n+' يوماً';
    const em=BG.filter(b=>v.badges[b.id]).map(b=>b.e).join(' ');
    const nb=BG.find(b=>b.k==='s'&&!v.badges[b.id]);
    const pct=nb?Math.min(100,Math.round(n/nb.n*100)):100;
    const goal=nb?'<small>الهدف التالي</small>'+nb.e+' '+nb.t+' ('+n+'/'+nb.n+')':'<small>الهدف</small>🎉 اكتملت الأهداف';
    $('#stk').innerHTML='<div class="sh"><div class="sl"><span class="fl">'+ic('flame')+'</span><div><small>سلسلتك</small><b>'+w+'</b></div></div><div class="sg">'+goal+'</div></div>'
      +'<div class="wk">'+cols+'</div><div class="gb"><i style="width:'+pct+'%"></i></div>'+(em?'<div class="st2">'+em+'</div>':'');
  }catch(e){}
}
function visit(){
  try{
    const k=keyOf(new Date());const v=loadV();
    if(v.last!==k){
      const y=new Date();y.setDate(y.getDate()-1);
      v.streak=(v.last===keyOf(y))?v.streak+1:1;
      v.best=Math.max(v.best,v.streak);v.total++;v.last=k;
      v.days.push(k);v.days=v.days.slice(-60);
      S.set('adhkar:streak',v);
    }
    award(v);renderStreak(v);
  }catch(e){}
}
function markTabs(){
  try{const a=loadV().done[keyOf(new Date())]||[];
    document.querySelectorAll('.tab').forEach((b,i)=>{if(docs[i])b.textContent=docs[i].title+(a.indexOf(docs[i].slug)>=0?' ✓':'')})}catch(e){}
}
function markDone(slug){
  try{
    const v=loadV(),k=keyOf(new Date()),a=v.done[k]||(v.done[k]=[]);
    if(a.indexOf(slug)>=0){markTabs();return}
    a.push(slug);v.comp++;
    if(docs.length>1&&docs.every(d=>a.indexOf(d.slug)>=0))v.full++;
    const ks=Object.keys(v.done);if(ks.length>400)ks.slice(0,ks.length-400).forEach(x=>delete v.done[x]);
    S.set('adhkar:streak',v);award(v);renderStreak(v);markTabs();
  }catch(e){}
}

   +'<div class="bgs">'+BG.map(b=>{const g=v.badges[b.id];return '<div class="bd'+(g?'':' lock')+'"><span class="em">'+b.e+'</span><div><b>'+b.t+'</b><small>'+(g?'حصلت عليه '+fmt(g):b.d)+'</small></div></div>'}).join('')+'</div></div>';

const R=[
{id:'m',n:'أذكار الصباح',re:/صباح|morning/i},
{id:'e',n:'أذكار المساء',re:/مساء|evening/i},
{id:'s',n:'أذكار النوم',re:/نوم|sleep/i}
];
const RD={m:{on:true,t:'05:30'},e:{on:true,t:'17:00'},s:{on:true,t:'22:00'}};
function getRem(){const s=S.get('adhkar:rem',{})||{},o={};R.forEach(r=>{o[r.id]=Object.assign({},RD[r.id],s[r.id]||{})});return o}
function docIdx(r){return docs.findIndex(d=>r.re.test(d.title+' '+d.slug))}
function notify(r,i){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body:'حان وقت '+r.n+' — اضغط للفتح',icon:'icon-192.png',tag:'adhkar-'+r.id,lang:'ar',dir:'rtl',data:{url:'./'+(i>=0?'#'+docs[i].slug:'')}};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null))
      .then(reg=>{reg?reg.showNotification('الأذكار',o):new Notification('الأذكار',o)}).catch(()=>{});
  }catch(e){}
}
function fire(r,i){
  const el=$('#rem');el.textContent='';el.hidden=false;
  const sp=document.createElement('span');sp.textContent='🔔 حان وقت '+r.n;el.append(sp);
  if(i>=0){const b=document.createElement('button');b.textContent='فتح';
    b.onclick=()=>{show(i);el.hidden=true;scrollTo({top:Math.max(0,$('#list').offsetTop-70),behavior:'smooth'})};el.append(b)}
  const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{el.hidden=true};el.append(x);
  navigator.vibrate&&navigator.vibrate(60);
  notify(r,i);

function check(){
  try{
    if(!docs.length)return;
    const rm=getRem(),fired=S.get('adhkar:remfired',{})||{},now=new Date(),nm=now.getHours()*60+now.getMinutes();
    R.forEach(r=>{
      const c=rm[r.id];if(!c.on)return;
      const p=c.t.split(':'),tm=(+p[0])*60+(+p[1]);
      if((nm-tm+1440)%1440>=240)return;
      const b=new Date(now);if(nm<tm)b.setDate(b.getDate()-1);
      const k=keyOf(b);
      if(fired[r.id]===k)return;
      fired[r.id]=k;S.set('adhkar:remfired',fired);
      const i=docIdx(r);
      if(i>=0&&(loadV().done[keyOf(now)]||[]).indexOf(docs[i].slug)>=0)return;
      fire(r,i);
    });
  }catch(e){}
}
function buildIcs(){
  const rm=getRem(),now=new Date(),pad=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const base=location.origin+location.pathname;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Adhkar//AR//EN','CALSCALE:GREGORIAN'];
  R.forEach(r=>{
    const c=rm[r.id];if(!c.on)return;
    const p=c.t.split(':'),s=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+p[0],+p[1]),e=new Date(s.getTime()+600000),i=docIdx(r);
    L.push('BEGIN:VEVENT','UID:adhkar-'+r.id+'@'+location.hostname,'DTSTAMP:'+f(now),'DTSTART:'+f(s),'DTEND:'+f(e),'RRULE:FREQ=DAILY',
      'SUMMARY:🔔 '+r.n,'DESCRIPTION:حان وقت '+r.n+'\\n'+base+(i>=0?'#'+docs[i].slug:''),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.n,'TRIGGER:PT0M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function dlIcs(){
  const blob=new Blob([buildIcs()],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='adhkar-reminders.ics';document.body.append(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},15000);
}
function openRem(){
  const rm=getRem(),ov=$('#ov'),ns='Notification' in window?Notification.permission:'na';
  const tx=ns==='granted'?'✅ إشعارات الجهاز مفعّلة':ns==='denied'?'⛔ الإشعارات محجوبة من إعدادات الجهاز':ns==='na'?'ℹ️ إشعارات الجهاز تعمل بعد تثبيت التطبيق على الشاشة الرئيسية':'🔕 إشعارات الجهاز غير مفعّلة بعد';
  ov.innerHTML='<div class="sheet"><h3><span>🔔 تنبيهات الأذكار</span><button class="x">'+ic('x')+'</button></h3>'
   +'<div class="goal">'+tx+'</div>'+(ns==='default'?'<button class="pbtn" id="rq">تفعيل إشعارات الجهاز</button>':'')
   +R.map(r=>'<div class="rr"><label><input type="checkbox" data-id="'+r.id+'"'+(rm[r.id].on?' checked':'')+'> '+r.n+'</label><input type="time" data-t="'+r.id+'" value="'+rm[r.id].t+'"></div>').join('')
   +'<button class="pbtn" id="rtest">'+ic('bell')+' تجربة تنبيه الآن</button><button class="pbtn" id="rics">'+ic('cal')+' إضافة للتقويم (ينبّهك والتطبيق مغلق)</button>'
   +'<div class="goal" style="margin-top:14px">التنبيه داخل التطبيق يظهر عند فتحه أو وهو مفتوح في الوقت المحدد. أما التنبيه والتطبيق مغلق فيحتاج إضافة الأوقات إلى تقويم الجوال.</div></div>';
  ov.classList.add('show');
  const save=()=>{const o={};ov.querySelectorAll('[data-id]').forEach(c=>{const id=c.dataset.id,t=ov.querySelector('[data-t="'+id+'"]').value||RD[id].t;o[id]={on:c.checked,t}});S.set('adhkar:rem',o);S.set('adhkar:remfired',{})};
  ov.querySelectorAll('input').forEach(i=>i.onchange=()=>{save();check()});
  const rq=ov.querySelector('#rq');if(rq)rq.onclick=()=>{try{Notification.requestPermission().then(openRem)}catch(e){}};
  ov.querySelector('#rtest').onclick=()=>{ov.classList.remove('show');fire(R[0],docIdx(R[0]))};
  ov.querySelector('#rics').onclick=dlIcs;
}
$('#bl').onclick=openRem;
setInterval(check,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1)),i=docs.findIndex(d=>d.slug===h);if(i>=0&&i!==cur)show(i)});
const FB0={snd:true,vol:6,tone:'soft',vib:true,str:'m',every:true};
function fbCfg(){return Object.assign({},FB0,S.get('adhkar:fb',{})||{})}
let AC=null;
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f1,f2,dur,type,vol,delay){
  try{
    const a=actx();if(!a)return;
    const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);
    if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function haptic(n,gap){
  const h=document.querySelector('.hx');if(!h)return;
  for(let i=0;i<n;i++)setTimeout(()=>{try{h.click()}catch(e){}},i*gap);
}
function fb(kind,force){
  const c=fbCfg();
  if(kind==='tap'&&!c.every&&!force)return;
  const v=c.vol/10;
  if(c.snd){
    if(kind==='tap'){
      if(c.tone==='bead')tone(720,380,.06,'triangle',.5*v);
      else if(c.tone==='drop')tone(520,980,.08,'sine',.45*v);
      else tone(880,880,.05,'sine',.4*v);
    }else if(kind==='done'){
      tone(660,660,.14,'sine',.45*v);tone(880,880,.2,'sine',.45*v,.12);
    }else{
      [523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'sine',.45*v,i*.13));
    }
  }
  if(c.vib){
    const base={l:10,m:22,s:40}[c.str]||22;
    if(navigator.vibrate){
      try{navigator.vibrate(kind==='tap'?base:kind==='done'?[base,50,base]:[base,60,base,60,base*2])}catch(e){}
    }else haptic(kind==='tap'?1:kind==='done'?2:3,90);
  }
}
function openSet(){
  const c=fbCfg(),ov=$('#ov');
  const sel=(k,o)=>'<select data-k="'+k+'">'+o.map(x=>'<option value="'+x[0]+'"'+(c[k]===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>';
  const note=(navigator.vibrate?'الاهتزاز مدعوم في جهازك.':'الآيفون لا يسمح بضبط قوة الاهتزاز، ويعمل اهتزاز خفيف في Safari على iOS 17.4 فأحدث.')+' الصوت يتبع زر الصامت في الجوال.';
  ov.innerHTML='<div class="sheet"><h3><span>الصوت والاهتزاز</span><button class="x">'+ic('x')+'</button></h3>'
   +'<div class="rr"><label><input type="checkbox" data-k="snd"'+(c.snd?' checked':'')+'> الصوت</label>'+sel('tone',[['soft','نقرة خفيفة'],['bead','حبّة سبحة'],['drop','قطرة']])+'</div>'
   +'<div class="rr"><label>مستوى الصوت</label><input type="range" min="1" max="10" step="1" data-k="vol" value="'+c.vol+'"></div>'
   +'<div class="rr"><label><input type="checkbox" data-k="vib"'+(c.vib?' checked':'')+'> الاهتزاز</label>'+sel('str',[['l','خفيف'],['m','متوسط'],['s','قوي']])+'</div>'
   +'<div class="rr"><label><input type="checkbox" data-k="every"'+(c.every?' checked':'')+'> عند كل ضغطة</label><small style="color:var(--mut)">وإلا عند الإتمام فقط</small></div>'
   +'<button class="pbtn" id="ft">تجربة الضغط</button><button class="pbtn" id="fd">تجربة إتمام ذكر</button><button class="pbtn" id="ff">تجربة ختم الأذكار</button>'
   +'<div class="goal" style="margin-top:14px">'+note+'</div></div>';
  ov.classList.add('show');
  const save=()=>{const o={};ov.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;o[k]=e.type==='checkbox'?e.checked:e.type==='range'?+e.value:e.value});S.set('adhkar:fb',o)};
  ov.querySelectorAll('[data-k]').forEach(e=>{e.onchange=save;e.oninput=save});
  ov.querySelector('#ft').onclick=()=>{save();fb('tap',true)};
  ov.querySelector('#fd').onclick=()=>{save();fb('done')};
  ov.querySelector('#ff').onclick=()=>{save();fb('fin')};
}
try{$('#bs').onclick=openSet}catch(e){}
visit();
init();
})();
